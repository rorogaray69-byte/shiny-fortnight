<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="2026-2027学年秋季学期研究生课表 · 实时查看今天与整周的课">
<title>2026-2027学年秋季学期研究生课表</title>
<style>
/* ============================================================
   设计变量 —— 浅色为默认，深色由 prefers-color-scheme / data-theme 覆盖
   ============================================================ */
:root {
  --bg:            #f4f5f7;
  --bg-accent:     #eceef2;
  --surface:       #ffffff;
  --surface-2:     #f7f8fa;
  --surface-3:     #eef0f4;
  --border:        #e2e5ea;
  --border-strong: #cfd4dc;
  --text:          #1b1f26;
  --text-2:        #5b6270;
  --text-3:        #8b93a1;
  --shadow-sm:     0 1px 2px rgba(16,20,28,.06), 0 1px 3px rgba(16,20,28,.04);
  --shadow-md:     0 2px 6px rgba(16,20,28,.08), 0 8px 24px rgba(16,20,28,.08);
  --shadow-lg:     0 8px 24px rgba(16,20,28,.14), 0 24px 60px rgba(16,20,28,.16);
  --accent:        #2f6fd0;
  --accent-soft:   #e8f0fc;
  --live:          #d94a3d;
  --live-soft:     #fdecea;
  --warn:          #b7791f;
  --warn-soft:     #fdf6e3;
  --past-opacity:  .45;
  --radius:        14px;
  --radius-sm:     9px;
  --row-h:         74px;
  --grid-gap:      5px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
          "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg:#0f1216; --bg-accent:#0b0e11; --surface:#171b21; --surface-2:#1c2128;
    --surface-3:#222831; --border:#282f38; --border-strong:#39424e;
    --text:#e8eaee; --text-2:#a3abb8; --text-3:#737d8c;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 8px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
    --shadow-lg:0 10px 30px rgba(0,0,0,.55),0 30px 70px rgba(0,0,0,.5);
    --accent:#5b95e8; --accent-soft:#17243a; --live:#ef6b5e; --live-soft:#2c1a19;
    --warn:#e0b055; --warn-soft:#2a2314; --past-opacity:.4;
  }
}
html[data-theme="dark"] {
  --bg:#0f1216; --bg-accent:#0b0e11; --surface:#171b21; --surface-2:#1c2128;
  --surface-3:#222831; --border:#282f38; --border-strong:#39424e;
  --text:#e8eaee; --text-2:#a3abb8; --text-3:#737d8c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 8px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.55),0 30px 70px rgba(0,0,0,.5);
  --accent:#5b95e8; --accent-soft:#17243a; --live:#ef6b5e; --live-soft:#2c1a19;
  --warn:#e0b055; --warn-soft:#2a2314; --past-opacity:.4;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow-wrap: break-word;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }
::selection { background: var(--accent); color: #fff; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 72px; }

/* ============================ 顶栏 ============================ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
@supports not (background: color-mix(in srgb, red, blue)) {
  .topbar { background: var(--surface); }
}
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 16px 10px; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 {
  font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.01em;
  flex: 1 1 auto; min-width: 0;
}
h1 .sub { font-weight: 500; color: var(--text-3); font-size: 13px; margin-left: 8px; white-space: nowrap; }
.icon-btn {
  flex: 0 0 auto;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
.icon-btn:active { transform: scale(.95); }

/* ---------- 周次条 ---------- */
.weekbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.weekbar .spacer { flex: 1 1 auto; }
.wb-btn {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 7px 12px; font-size: 13.5px; font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.wb-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
.wb-btn:disabled { opacity: .4; cursor: not-allowed; }
.wb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.wb-btn.primary:hover { filter: brightness(1.08); }
.week-label {
  font-weight: 700; font-size: 15px; min-width: 76px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.week-label .range { display: block; font-weight: 500; font-size: 11.5px; color: var(--text-3); }
select.wk-select {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 7px 8px; font-size: 14px;
}
.badge-now {
  font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.badge-now[hidden] { display: none; }

/* ---------- 搜索 ---------- */
.searchbar { position: relative; margin-top: 10px; }
.searchbar input {
  width: 100%; padding: 10px 38px 10px 36px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 11px; font-size: 14.5px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.searchbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbar .s-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-3); font-size: 14px; pointer-events: none;
}
.searchbar .s-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--text-3);
  font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; display: none;
}
.searchbar .s-clear:hover { background: var(--surface-3); color: var(--text); }
.searchbar.has-value .s-clear { display: block; }

/* 搜索结果下拉 */
.search-results {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 45;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow-lg);
  max-height: min(52vh, 420px); overflow-y: auto; padding: 6px;
}
.search-results[hidden] { display: none; }
.sr-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border: 0; background: transparent; border-radius: 9px;
  text-align: left;
}
.sr-item:hover, .sr-item.active { background: var(--surface-2); }
.sr-dot { width: 9px; height: 9px; border-radius: 99px; flex: 0 0 auto; }
.sr-main { flex: 1 1 auto; min-width: 0; }
.sr-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-code { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.sr-empty { padding: 14px 12px; color: var(--text-3); font-size: 13.5px; text-align: center; }

/* ============================ Tabs ============================ */
.tabs {
  display: inline-flex; gap: 4px; margin-top: 12px;
  background: var(--surface-3); padding: 4px; border-radius: 12px;
}
.tab {
  border: 0; background: transparent; border-radius: 9px;
  padding: 8px 20px; font-size: 14.5px; font-weight: 600; color: var(--text-2);
  transition: background .15s, color .15s; white-space: nowrap;
}
.tab[aria-selected="true"] {
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm);
}

/* ============================ 面板通用 ============================ */
.panel { padding-top: 18px; }
.panel[hidden] { display: none; }
.empty {
  text-align: center; padding: 64px 20px; color: var(--text-3);
  background: var(--surface); border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}
.empty .big { font-size: 40px; margin-bottom: 10px; }
.empty .t { font-size: 17px; font-weight: 600; color: var(--text-2); }
.empty .d { font-size: 13.5px; margin-top: 6px; }

/* ============================ 今天视图 ============================ */
.today-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.today-date { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.today-week { font-size: 13.5px; color: var(--text-2); }
.today-week b { color: var(--accent); }
.now-banner {
  display: flex; align-items: center; gap: 10px;
  margin: -4px 0 14px; padding: 11px 14px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.now-banner.live { background: var(--live-soft); color: var(--live);
  border-color: color-mix(in srgb, var(--live) 26%, transparent); }
.now-banner[hidden] { display: none; }
.now-banner .pulse-dot {
  width: 8px; height: 8px; border-radius: 99px; background: currentColor; flex: 0 0 auto;
  animation: pulse 1.6s ease-in-out infinite;
}
.now-banner .spacer { flex: 1 1 auto; }
.now-banner .tick { font-variant-numeric: tabular-nums; font-weight: 700; }
.now-banner .go {
  border: 0; background: transparent; color: inherit; text-decoration: underline;
  font-size: 12.5px; font-weight: 600; padding: 0;
}

.cards { display: flex; flex-direction: column; gap: 12px; }
.card {
  position: relative; display: flex; gap: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, transform .2s, opacity .2s;
}
.card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: var(--c, var(--accent));
}
.card-body { flex: 1 1 auto; min-width: 0; padding: 14px 16px 14px 20px; }
.card-top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.card-period {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px;
  background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent);
  color: var(--c, var(--accent));
}
@supports not (background: color-mix(in srgb, red, blue)) {
  .card-period { background: var(--surface-3); }
}
.card-time { font-family: var(--mono); font-size: 13px; color: var(--text-2); font-weight: 600; }
.chip {
  font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--surface-3); color: var(--text-2); white-space: nowrap;
}
.chip.campus-east { background: #e6f5f6; color: #1d7c83; }
html[data-theme="dark"] .chip.campus-east { background: #16302f; color: #6fc9d0; }
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] .chip.campus-east { background: #16302f; color: #6fc9d0; }
}
.chip.live { background: var(--live-soft); color: var(--live); }
.card-name {
  font-size: 17px; font-weight: 700; margin: 7px 0 0; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 8px;
}
.card-meta {
  display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 7px;
  font-size: 13.5px; color: var(--text-2);
}
.card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.card-meta .k { color: var(--text-3); font-size: 12.5px; }
.card-note { margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
.card-actions { flex: 0 0 auto; display: flex; align-items: flex-start; padding: 14px 14px 0 0; }

.card.is-past { opacity: var(--past-opacity); }
.card.is-past .card-name { text-decoration: none; }

/* —— 进行中：左侧色条加粗 + 呼吸脉冲 —— */
.card.is-live {
  border-color: color-mix(in srgb, var(--live) 55%, var(--border));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 14%, transparent), var(--shadow-md);
  animation: breathe 2.4s ease-in-out infinite;
}
.card.is-live::before { width: 7px; background: var(--live); }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 12%, transparent), var(--shadow-sm); }
  50%      { box-shadow: 0 0 0 7px color-mix(in srgb, var(--live) 20%, transparent), var(--shadow-md); }
}
@keyframes pulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:.35; transform: scale(.82);} }
.live-bar {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  font-size: 13px; font-weight: 700; color: var(--live);
  font-variant-numeric: tabular-nums;
}
.live-bar .track {
  flex: 1 1 auto; height: 5px; border-radius: 99px; background: var(--live-soft);
  overflow: hidden; max-width: 320px;
}
.live-bar .fill { height: 100%; background: var(--live); border-radius: 99px; transition: width .5s linear; }

/* 冲突提示（真有时间冲突时才是警示色） */
.conflict {
  margin-top: 9px; padding: 8px 11px; border-radius: 8px;
  background: var(--warn-soft); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent);
  font-size: 12.5px; font-weight: 600;
}
@supports not (background: color-mix(in srgb, red, blue)) {
  .conflict { background: var(--surface-3); }
}

/* 一般性提示信息（不是警告，不要用警示色） */
.note {
  margin-top: 9px; padding: 8px 11px; border-radius: 8px;
  background: var(--surface-3); color: var(--text-2);
  border: 1px solid var(--border);
  font-size: 12.5px;
}

/* ============================ 整周视图 ============================ */
.week-toolbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 12px; font-size: 13.5px; color: var(--text-2);
}
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  width: 38px; height: 22px; border-radius: 99px; background: var(--border-strong);
  position: relative; transition: background .18s; flex: 0 0 auto;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
  border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .18s;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }

.grid-scroll {
  overflow-x: auto; overflow-y: visible;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow-sm);
  -webkit-overflow-scrolling: touch;
}
.grid {
  display: grid;
  grid-template-columns: 62px repeat(7, minmax(122px, 1fr));
  /* 第 1 行是表头；其后 13 行严格对应 13 个节次。课程块用 grid-row 显式铺在这些行上，
     所以行高不会被内容撑大，节次与课程块永远对齐。 */
  grid-template-rows: auto repeat(13, minmax(var(--row-h), auto));
  min-width: 100%;
}
.grid .corner, .grid .day-head, .grid .period-head, .grid .cell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
/* 行头（节次列）—— 窄屏 sticky */
.grid .period-head {
  position: sticky; left: 0; z-index: 6;
  background: var(--surface-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px 2px; gap: 1px;
}
.grid .period-head .n { font-size: 15px; font-weight: 800; color: var(--text-2); line-height: 1; }
.grid .period-head .t { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); line-height: 1.25; text-align: center; }
.grid .corner {
  position: sticky; left: 0; z-index: 8; top: 0;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; color: var(--text-3); font-weight: 600;
}
.grid .day-head {
  position: sticky; top: 0; z-index: 7;
  background: var(--surface-2);
  padding: 8px 6px 7px; text-align: center;
}
.grid .day-head .dn { font-size: 14px; font-weight: 700; }
.grid .day-head .dd { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.grid .day-head.is-today { background: var(--accent-soft); }
.grid .day-head.is-today .dn { color: var(--accent); }
.grid .day-head.is-today .dd { color: var(--accent); font-weight: 700; }
.grid .day-head.is-weekend .dn { color: var(--text-2); }

.grid .cell {
  position: relative; padding: 0; display: block;
  min-height: var(--row-h);
}

/* 课程块容器：由 JS 用 grid-column / grid-row:<start> / span <n> 精确定位。
   容器横向 flex —— 同一时段有两门课（如工程热力学 + 气固表面反应）时并排显示，互不遮挡。 */
.grid .slot {
  display: flex; gap: 3px; padding: var(--grid-gap);
  min-width: 0; pointer-events: none; z-index: 1;
}
.grid .slot > .blk { pointer-events: auto; flex: 1 1 0; width: auto; min-width: 0; }
.grid .cell.is-today-col { background: color-mix(in srgb, var(--accent) 5%, transparent); }
@supports not (background: color-mix(in srgb, red, blue)) {
  .grid .cell.is-today-col { background: var(--surface-2); }
}
.grid .cell.is-empty { color: transparent; }
.grid .cell .slot-hint {
  position: absolute; inset: auto 6px 4px auto; font-size: 10px; color: var(--border-strong);
}

.blk {
  position: relative; flex: 1 1 auto; min-height: 0;
  border: 0; text-align: left; width: 100%;
  border-radius: 9px; padding: 6px 8px;
  background: color-mix(in srgb, var(--c) 15%, var(--surface));
  border-left: 4px solid var(--c);
  color: var(--text); overflow: hidden;
  display: flex; flex-direction: column; gap: 2px;
  transition: transform .12s, box-shadow .15s, filter .15s;
}
@supports not (background: color-mix(in srgb, red, blue)) {
  .blk { background: var(--surface-2); }
}
.blk:hover { filter: brightness(1.04); box-shadow: var(--shadow-md); transform: translateY(-1px); z-index: 2; }
.blk:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.blk .bn {
  font-size: 12.5px; font-weight: 700; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.blk .br { font-size: 11px; color: var(--text-2); line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.blk .bw { font-size: 10px; color: var(--c); font-weight: 700; }
.blk.is-live {
  box-shadow: 0 0 0 2px var(--live), var(--shadow-md);
  animation: breathe-sm 2s ease-in-out infinite;
}
@keyframes breathe-sm {
  0%,100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 70%, transparent), var(--shadow-sm); }
  50%     { box-shadow: 0 0 0 5px color-mix(in srgb, var(--live) 28%, transparent), var(--shadow-md); }
}
/* 非本周课程：降透明度 + 虚线描边 —— 保证相邻的深红系块（工程热力学 #c00000 /
   习近平专题 #c0392b）在"显示非本周"模式下也能区分开 */
.blk.is-offweek {
  opacity: .42;
  filter: grayscale(.6);
  outline: 1px dashed var(--border-strong);
  outline-offset: -1px;
}
.blk.is-dim { opacity: .3; }
.blk.is-match { box-shadow: 0 0 0 2.5px var(--accent), var(--shadow-md); }
.blk.is-dimmed-by-search { opacity: .22; filter: grayscale(.7); }
.blk .tiny-badge {

      var e = entries[i];
      for (var w = 1; w <= 20; w++) if (weekInRanges(w, e.weekRanges)) set[w] = true;
    }
    var ks = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
    if (!ks.length) return "";
    // 压成区间
    var out = [], s = ks[0], prev = ks[0];
    for (var q = 1; q <= ks.length; q++) {
      var cur = ks[q];
      if (cur !== prev + 1) {
        out.push(s === prev ? String(s) : (s + "-" + prev));
        s = cur;
      }
      prev = cur;
    }
    return "第 " + out.join("、") + " 周";
  }

  /* ------------------------------------------------------------------
     4. 应用状态
     ------------------------------------------------------------------ */
  var state = {
    tab: "today",
    week: 1,
    termStart: "2026-08-31",
    showOffWeek: true,
    q: "",
    theme: "auto",
    dayOverride: 0,        // 0 = 用真实今天的星期
    todayDow: 1,           // 真实今天的星期（1-7）
    nowMin: 0
  };
  var appBuiltAt = "2026-01-01T00:00:00.000Z";

  /* ------------------------------------------------------------------
     5. "现在"的计算
     ------------------------------------------------------------------ */
  var liveTick = {
    live: null,       // 正在上的课
    next: null,       // 下一节
    others: [],       // 同一时刻并行的其他课（跨校区）
    conflict: false   // 时间区间重叠 → 需要赶场
  };

  function computeLive(dayCourses, nowMinutes) {
    var live = [], next = null;
    for (var i = 0; i < dayCourses.length; i++) {
      var c = dayCourses[i];
      if (nowMinutes >= c.startMin && nowMinutes < c.endMin) live.push(c);
      else if (c.startMin > nowMinutes) {
        if (!next || c.startMin < next.startMin) next = c;
      }
    }
    if (!next) {
      // 找下一节也是"最近即将开始"的（用最早开始时间）
      for (var j = 0; j < dayCourses.length; j++) {
        var d = dayCourses[j];
        if (d.startMin > nowMinutes && (!next || d.startMin < next.startMin)) next = d;
      }
    }
    // 冲突：并行课程的时间区间互相重叠
    var conflict = false;
    for (var a = 0; a < live.length; a++) {
      for (var b = a + 1; b < live.length; b++) {
        if (live[a].startMin < live[b].endMin && live[b].startMin < live[a].endMin) conflict = true;
      }
    }
    liveTick = { live: live, next: next, conflict: conflict };
    return liveTick;
  }

  /* ------------------------------------------------------------------
     6. 渲染：今天视图
     ------------------------------------------------------------------ */
  function coursesForDay(dow, week) {
    var out = [];
    for (var i = 0; i < DATA.courses.length; i++) {
      var c = DATA.courses[i];
      if (c.day !== dow) continue;
      if (!weekInRanges(week, c.weekRanges)) continue;
      out.push(c);
    }
    out.sort(function (a, b) {
      return a.startMin - b.startMin || a.periodStart - b.periodStart || a.name.localeCompare(b.name, "zh");
    });
    return out;
  }
  /** 与 coursesForDay 相同，但忽略周次过滤 */
  function coursesForDayAllWeeks(dow) {
    var out = [];
    for (var i = 0; i < DATA.courses.length; i++) {
      if (DATA.courses[i].day === dow) out.push(DATA.courses[i]);
    }
    out.sort(function (a, b) { return a.startMin - b.startMin; });
    return out;
  }

  function campusChip(c) {
    if (!c.campus) return "";
    var label = c.isEast ? "云大东陆" : (c.campus.indexOf("云南师范大学") >= 0 ? "师大一二一" : c.campus);
    return '<span class="chip' + (c.isEast ? " campus-east" : "") + '" title="' + esc(c.campus) + '">' + esc(label) + "</span>";
  }

  function renderToday() {
    var d = state.dayOverride ? mondayOfWeekBase(state.dayOverride) : new Date();
    var dow = state.dayOverride ? state.dayOverride : state.todayDow;
    var isRealToday = !state.dayOverride;
    var dayDate = dayDateFor(dow);

    $("todayDate").textContent = (dayDate.getMonth() + 1) + "月" + dayDate.getDate() + "日 " +
      "周" + "一二三四五六日".charAt(dow - 1);

    var wk = weekIndexOf(dayDate, parseYmd(state.termStart));
    var wkTxt = (wk && wk >= 1) ? ("第 <b>" + wk + "</b> 教学周") : "不在学期内";
    $("todayWeek").innerHTML = wkTxt + (isRealToday ? " · 今天" : ' · <a href="#" id="backRealToday">回到今天</a>');
    var back = $("backRealToday");
    if (back) back.addEventListener("click", function (e) { e.preventDefault(); state.dayOverride = 0; $("dayOverride").value = "0"; saveSettings(); syncURL(); renderAll(); });

    // —— 当前教学周内的课 ——
    var list = (wk && wk >= 1) ? coursesForDay(dow, wk) : coursesForDay(dow, state.week);
    // 周次过滤后为空，但该天其实有课 → 提示并展示全部（置灰外观不适用于今天视图，直接展示）
    var hiddenByWeek = false;
    if (!list.length) {
      var all = coursesForDayAllWeeks(dow);
      if (all.length && wk && wk >= 1) { list = all; hiddenByWeek = true; }
      else if (all.length && !wk) { hiddenByWeek = false; }
    }

    var nowMin = state.nowMin;
    // 注意：回退分支里的 list 装的是「本周没课、但别的周有课」的安排，
    // 这些课本周根本不发生，**绝不能参与「正在上课」计算** —— 否则会显示
    // "正在上课：XXX"甚至"⚠️ 有并行课程"这种假提示（不同周次的两门课从不同周开）。
    var tick = (isRealToday && !hiddenByWeek)
      ? computeLive(list, nowMin)
      : { live: [], next: null, conflict: false };
    var liveSet = {};
    for (var li = 0; li < tick.live.length; li++) liveSet[tick.live[li].uid] = true;

    // —— 顶部状态条 ——
    var banner = $("nowBanner");
    if (hiddenByWeek) {
      // 本周这一天没课；下面展示的是其他周次的安排（供参考），不代表今天要上课
      banner.hidden = false; banner.className = "now-banner";
      banner.innerHTML = "<span>📅 第 " + wk + " 周这一天没有课；下面显示的是该天的其他周次安排（仅供参考）</span>";
      banner.onclick = null;
    } else if (!isRealToday) {
      banner.hidden = false; banner.className = "now-banner";
      banner.innerHTML = '<span>📅 正在预览 <b>周' + "一二三四五六日".charAt(dow - 1) + "</b> 的课程（非实时高亮）</span>";
    } else if (tick.live.length) {
      var first = tick.live[0];
      var leftMin = first.endMin - nowMin;
      var pct = Math.round((nowMin - first.startMin) / Math.max(1, first.endMin - first.startMin) * 100);
      banner.hidden = false; banner.className = "now-banner live";
      banner.innerHTML =
        '<span class="pulse-dot"></span>' +
        "<span>正在上课：" + esc(first.shortName) + " · 还剩 <span class=\"tick\">" + humanLeft(leftMin) + "</span></span>" +
        '<span class="track-wrap" style="flex:1 1 auto;max-width:220px"><span class="track" style="display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden"><span class="fill" style="display:block;height:100%;width:' + pct + '%;background:currentColor"></span></span></span>' +
        (tick.conflict ? '<span class="go">⚠️ 有并行课程</span>' : "");
      banner.onclick = function () { scrollToCard(first.uid); };
    } else if (tick.next) {
      var wait = tick.next.startMin - nowMin;
      banner.hidden = false; banner.className = "now-banner";
      banner.innerHTML = "<span>☕ 课间休息 · 下一节 <b>" + esc(tick.next.time.split("-")[0]) +
        "</b> 开始（" + humanLeft(wait) + "后）· " + esc(tick.next.shortName) + "</span>";
      banner.onclick = function () { scrollToCard(tick.next.uid); };
    } else if (list.length) {
      banner.hidden = false; banner.className = "now-banner";
      banner.innerHTML = "<span>🌙 今天的课已经全部结束了，早点休息～</span>";
      banner.onclick = null;
    } else {
      banner.hidden = true; banner.onclick = null;
    }

    // —— 卡片 ——
    var box = $("todayCards");
    if (!list.length) {
      box.innerHTML =
        '<div class="empty"><div class="big">🎉</div>' +
        '<div class="t">今天没有课</div>' +
        '<div class="d">' + esc((dayDate.getMonth() + 1) + "月" + dayDate.getDate() + "日") +
        " · 好好休息或安排自己的事情吧</div></div>";
      return;
    }

    var html = [];
    if (hiddenByWeek) {
      // 用 .note 而不是 .conflict：这是说明性提示，不是"时间冲突"警告
      html.push('<div class="note">ℹ️ 第 ' + wk + ' 周按周次安排本没有课；下面显示的是该天的全部课程安排（含其他周次），仅供参考。</div>');
    }
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var isLive = !!liveSet[c.uid];
      var isPast = isRealToday && !isLive && c.endMin <= nowMin;
      // 与进行中的课冲突？
      var conflictWith = null;
      if (isLive && tick.live.length > 1) {
        for (var x = 0; x < tick.live.length; x++) {
          var o = tick.live[x];
          if (o.uid !== c.uid && o.startMin < c.endMin && c.startMin < o.endMin) { conflictWith = o; break; }
        }
      }

      var cls = "card" + (isLive ? " is-live" : "") + (isPast ? " is-past" : "");
      html.push('<article class="' + cls + '" id="card-' + c.uid + '" style="--c:' + c.color + '" data-uid="' + c.uid + '">');
      html.push('<div class="card-body">');
      html.push('<div class="card-top">');
      html.push('<span class="card-period">' + (c.periodStart === c.periodEnd ? (c.periodStart + " 节") : (c.periodStart + "-" + c.periodEnd + " 节")) + "</span>");
      if (c.periodStart !== c.periodEnd) html.push('<span class="chip">连堂</span>');
      html.push('<span class="card-time">' + esc(c.time) + "</span>");
      html.push(campusChip(c));
      if (isLive) html.push('<span class="chip live">进行中</span>');
      if (isPast) html.push('<span class="chip">已结束</span>');
      html.push("</div>");
      html.push('<h3 class="card-name">' + esc(c.name) + "</h3>");
      html.push('<div class="card-meta">');
      if (c.teacher) html.push('<span><span class="k">教师</span>' + esc(c.teacher) + "</span>");
      if (c.room) html.push('<span><span class="k">教室</span>' + esc(c.room) + "</span>");
      if (c.code) html.push('<span><span class="k">课码</span><span style="font-family:var(--mono);font-size:12.5px">' + esc(c.code) + "</span></span>");
      html.push("</div>");
      if (c.weekText) html.push('<div class="card-note">周次：' + esc(c.weekText) + "</div>");
      if (isLive) {
        var left = c.endMin - nowMin;
        var pct2 = Math.round((nowMin - c.startMin) / Math.max(1, c.endMin - c.startMin) * 100);
        html.push('<div class="live-bar"><span>进行中 · 还剩 ' + humanLeft(left) + "</span>" +
          '<span class="track"><span class="fill" style="width:' + pct2 + '%"></span></span>' +
          "<span>" + esc(c.time.split("-")[1]) + " 下课</span></div>");
      }
      if (conflictWith) {
        html.push('<div class="conflict">⚠️ 与「' + esc(conflictWith.shortName) + "」（" + esc(conflictWith.time) + " · " +
          esc(conflictWith.room || conflictWith.campus) + "）时间冲突，注意赶场！</div>");
      }
      html.push("</div>");
      html.push('<div class="card-actions"><button class="icon-btn js-detail" data-code="' + esc(c.code) + '" data-uid="' + c.uid + '" title="查看详情" aria-label="查看详情">›</button></div>');
      html.push("</article>");
    }
    box.innerHTML = html.join("");
  }

  /** 该 dow（1-7）在本周对应的日期 */
  function dayDateFor(dow) {
    var base;
    if (state.dayOverride) base = mondayOfWeekBase(state.dayOverride);
    else base = new Date();
    var monday = addDays(startOfDay(base), -(isoDow(base) - 1));
    return addDays(monday, dow - 1);
  }
  /** 把 dow 当成"这一周里的那一天"，返回本周周一（用于预览模式） */
  function mondayOfWeekBase(dow) { return dayDateForReal(dow); }
  function dayDateForReal(dow) {
    var t = startOfDay(new Date());
    var monday = addDays(t, -(isoDow(t) - 1));
    return addDays(monday, dow - 1);
  }
  function scrollToCard(uid) {
    var el = $("card-" + uid);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  /* ------------------------------------------------------------------
     7. 渲染：整周网格
     ------------------------------------------------------------------ */
  function renderWeek() {
    var week = state.week;
    var monday = mondayOfWeek(week, parseYmd(state.termStart));
    var today = startOfDay(new Date());
    var realWeek = weekIndexOf(today, parseYmd(state.termStart));
    var todayKey = today.getTime();

    // —— 表头星期 + 日期 ——
    var out = [];
    // 骨架与课程块**全部**显式指定 grid 坐标：一旦让它们参与自动排布，
    // 显式定位的课程块会占住格子，自动排布的骨架只能绕开，13 行就被挤错位。
    out.push('<div class="corner" style="grid-row:1;grid-column:1;">节次</div>');
    for (var d = 1; d <= 7; d++) {
      var dd = addDays(monday, d - 1);
      var isToday = dd.getTime() === todayKey;
      var cls = "day-head" + (isToday ? " is-today" : "") + (d >= 6 ? " is-weekend" : "");
      out.push('<div class="' + cls + '" style="grid-row:1;grid-column:' + (d + 1) + ';"><div class="dn">' + DAYS[d - 1] + (isToday ? " · 今天" : "") +
        '</div><div class="dd">' + (dd.getMonth() + 1) + "/" + dd.getDate() + "</div></div>");
    }

    // —— 每节一行 ——
    var liveUids = {};
    var showTodayCol = (realWeek === week);
    for (var li = 0; li < liveTick.live.length; li++) liveUids[liveTick.live[li].uid] = true;

    var q = state.q.toLowerCase();
    var matchCount = 0;

    // —— 先把课程按 (星期, 起始节) 归并成"时段槽" ——
    // 同一门课在同一时段往往有多条记录（不同周次/不同教师，例如「1周李明、2周段远源」，
    // 或「新时代理论」第 10~18 周各一条）。周视图里同一门课同一时段只画一个块：本周有安排
    // 就画那条，否则画一条置灰的「非本周」，其余记录点开详情看。
    // 不做这个归并的话，周二第 1 节会堆 8 个块把该行撑到 770px 高，13 行网格会彻底错位。
    var slotMap = {};    // "day|ps" -> {day, ps, pe, byCode:{}}
    for (var i = 0; i < DATA.courses.length; i++) {
      var c = DATA.courses[i];
      var inWeek = weekInRanges(week, c.weekRanges);
      if (!inWeek && !state.showOffWeek) continue;
      var sk = c.day + "|" + c.periodStart;
      var sl = slotMap[sk];
      if (!sl) sl = slotMap[sk] = { day: c.day, ps: c.periodStart, pe: c.periodEnd, byCode: {} };
      var ck = c.code || c.name;
      var gr = sl.byCode[ck];
      if (!gr) gr = sl.byCode[ck] = { code: c.code, best: null, inWeek: false, others: 0, match: false };
      if (q && c._search.indexOf(q) >= 0) gr.match = true;
      if (inWeek && !gr.inWeek) { gr.best = c; gr.inWeek = true; }
      else if (!gr.best) { gr.best = c; }
      else { gr.others++; }
      // 槽位跨度只按"最终会被画出来的那条记录"（gr.best）算，见渲染循环里 peMax 的计算。
      // 不要在这里累加所有周次的 periodEnd：否则第 16 周数值分析明明只到第 6 节，
      // 也会因为第 3-15 周那条(到第 8 节)而被画成 span 4。
    }

    // —— 骨架：节次行头 + 91 个空格 ——
    // 每格恰好占 1 行（min-height = --row-h），里面不塞课程块，
    // 这样 13 行严格等距，与左侧节次时间一一对齐。
    for (var p = 1; p <= PERIOD_COUNT; p++) {
      var slotTxt = DATA.periods[p - 1] ? DATA.periods[p - 1].time : "";
      var pt = slotTxt ? slotTxt.split("-") : ["", ""];
      out.push('<div class="period-head" style="grid-row:' + (p + 1) + ';grid-column:1;" role="rowheader"><span class="n">' + p +
        '</span><span class="t">' + esc(pt[0] || "") + "<br>" + esc(pt[1] || "") + "</span></div>");
      for (var dow = 1; dow <= 7; dow++) {
        var dd2 = addDays(monday, dow - 1);
        var isTodayCol = dd2.getTime() === todayKey;
        var cellCls = "cell" + (isTodayCol && showTodayCol ? " is-today-col" : "");
        out.push('<div class="' + cellCls + '" style="grid-row:' + (p + 1) + ';grid-column:' + (dow + 1) + ';"></div>');
      }
    }

    // —— 课程块：用显式 grid-row / grid-column 铺到对应的行上 ——
    // 不能塞进 .cell 里用 flex 堆叠：那样块只能占起始行的自然高度，多块叠加会把该行撑爆，
    // 于是 13 行的行高被内容决定、与左侧节次彻底错位。
    var slotKeys = [];
    for (var kk in slotMap) if (Object.prototype.hasOwnProperty.call(slotMap, kk)) slotKeys.push(kk);
    slotKeys.sort(function (a, b) {
      var A = slotMap[a], B = slotMap[b];
      return A.day - B.day || A.ps - B.ps;
    });

    for (var si = 0; si < slotKeys.length; si++) {
      var s2 = slotMap[slotKeys[si]];
      var codes = [];
      for (var ck2 in s2.byCode) if (Object.prototype.hasOwnProperty.call(s2.byCode, ck2)) codes.push(s2.byCode[ck2]);
      codes.sort(function (a, b) { return (a.code || "").localeCompare(b.code || ""); });
      // 槽位跨度 = 该时段内「会被画出来的课码」的 periodEnd 最大值。
      // 用 gr.best.periodEnd（各课码实际渲染的那条记录）而不是所有周次的 periodEnd 最大值，
      // 避免第 16 周数值分析(5-6节, 13:40-15:15) 被画成 span 4 盖到第 8 节。
      var peMax = s2.ps;
      for (var zp = 0; zp < codes.length; zp++) {
        if (!codes[zp].best) continue;
        if (codes[zp].best.periodEnd > peMax) peMax = codes[zp].best.periodEnd;
      }
      var span2 = clampSpan(peMax - s2.ps + 1);
      var anyMatch = false;
      for (var z = 0; z < codes.length; z++) if (codes[z].match) anyMatch = true;
      if (anyMatch) matchCount++;

      out.push('<div class="slot" style="grid-column:' + (s2.day + 1) + ";grid-row:" + (s2.ps + 1) +
        " / span " + span2 + ';">');
      for (var v = 0; v < codes.length; v++) {
        var gr2 = codes[v], bc = gr2.best;
        if (!bc) continue;
        var bCls = "blk";
        if (!gr2.inWeek) bCls += " is-offweek";
        if (gr2.inWeek && liveUids[bc.uid] && showTodayCol) bCls += " is-live";
        if (q) bCls += gr2.match ? " is-match" : " is-dimmed-by-search";

        out.push('<button class="' + bCls + '" style="--c:' + bc.color + ';" data-uid="' + bc.uid +
          '" data-code="' + esc(bc.code) + '" title="' + esc(bc.name + " · " + bc.teacher + " · " + bc.room + " · " + bc.time) + '">');
        out.push('<span class="bn">' + esc(bc.shortName) + "</span>");
        if (bc.room) out.push('<span class="br">' + esc(bc.room) + "</span>");
        out.push('<span class="bt">' + esc(bc.time) + "</span>");
        if (gr2.inWeek && q && gr2.match) out.push('<span class="tiny-badge">命中</span>');
        else if (!gr2.inWeek) out.push('<span class="bt">非本周' + (bc.weekText ? " · " + esc(bc.weekText) : "") + "</span>");
        else if (bc.isEast) out.push('<span class="east-dot" title="云大东陆校区"></span>');
        if (gr2.others > 0) out.push('<span class="bt">+' + gr2.others + " 条其他周次</span>");
        out.push("</button>");
      }
      out.push("</div>");
    }

    $("grid").innerHTML = out.join("");

    // 汇总
    var cnt = 0;
    for (var z = 0; z < DATA.courses.length; z++) if (weekInRanges(week, DATA.courses[z].weekRanges)) cnt++;
    var mondayTxt = (monday.getMonth() + 1) + "月" + monday.getDate() + "日";
    var sunday = addDays(monday, 6);
    $("weekSummary").textContent = "本周共 " + cnt + " 节课 · " + mondayTxt + " – " +
      (sunday.getMonth() + 1) + "月" + sunday.getDate() + "日" +
      (realWeek === week ? "（本周）" : "");
    $("wkRange").textContent = mondayTxt + " – " + (sunday.getMonth() + 1) + "/" + sunday.getDate();

    if (!isFinite(state._matchCache)) { /* noop */ }
    state._matchCount = matchCount;
  }

  /* ------------------------------------------------------------------
     8. 详情弹层
     ------------------------------------------------------------------ */
  function openDetail(codeOrUid, uid) {
    var group = null, entry = null;
    if (uid) {
      for (var i = 0; i < DATA.courses.length; i++) if (DATA.courses[i].uid === uid) { entry = DATA.courses[i]; break; }
    }
    var key = entry ? (entry.code || entry.name) : codeOrUid;
    for (var j = 0; j < DATA.courseList.length; j++) {
      if (DATA.courseList[j].code === key || DATA.courseList[j].name === key) { group = DATA.courseList[j]; break; }
    }
    if (!group && entry) {
      group = { code: entry.code, name: entry.name, shortName: entry.shortName, color: entry.color,
        entries: [entry], teachers: [entry.teacher], rooms: [entry.room], campuses: [entry.campus], weeks: "" };
    }
    if (!group) return;

    var color = group.color || "#888";
    $("modalHead").style.setProperty("--c", color);
    $("mTitle").textContent = group.name;
    $("mTitle").style.color = "";
    $("mCode").innerHTML = (group.code ? esc(group.code) + " · " : "") + esc(group.weeks || "");

    var body = [];
    body.push('<div class="kv">');
    body.push('<div class="k">课程代码</div><div class="v" style="font-family:var(--mono)">' + esc(group.code || "—") + "</div>");
    body.push('<div class="k">授课教师</div><div class="v">' + esc(group.teachers.filter(Boolean).join(" / ") || "—") + "</div>");
    body.push('<div class="k">上课地点</div><div class="v">' + esc(group.rooms.filter(Boolean).join(" / ") || "—") + "</div>");
    body.push('<div class="k">校区</div><div class="v">' + esc(group.campuses.filter(Boolean).join(" / ") || "—") + "</div>");
    body.push('<div class="k">周次</div><div class="v">' + esc(group.weeks || "全学期") + "</div>");
    body.push('<div class="k">总条目</div><div class="v">' + group.entries.length + " 条安排明细</div>");
    body.push("</div>");

    // 以"星期 × 节次"分组汇总
    body.push('<p class="section-title">每周固定时间</p>');
    body.push('<div class="kv" style="grid-template-columns:76px 1fr">');
    var bySlot = {};
    var slotOrder = [];
    for (var e = 0; e < group.entries.length; e++) {
      var en = group.entries[e];
      var sk = en.day + "-" + en.periodStart + "-" + en.periodEnd + "-" + en.time;
      if (!bySlot[sk]) { bySlot[sk] = []; slotOrder.push(sk); }
      bySlot[sk].push(en);
    }
    slotOrder.sort(function (a, b) {
      var A = a.split("-").map(Number), B = b.split("-").map(Number);
      return A[0] - B[0] || A[1] - B[1];
    });
    for (var s = 0; s < slotOrder.length; s++) {
      var arr = bySlot[slotOrder[s]];
      var f = arr[0];
      body.push('<div class="k">' + DAYS[f.day - 1] + "</div><div class='v'>第 " +
        (f.periodStart === f.periodEnd ? f.periodStart : (f.periodStart + "-" + f.periodEnd)) + " 节 · " +
        esc(f.time) + " · " + esc(f.room || "—") + (f.isEast ? ' <span class="chip campus-east">云大东陆</span>' : "") + "</div>");
    }
    body.push("</div>");

    // 明细表
    body.push('<p class="section-title" style="margin-top:20px">全部安排明细（周次 / 教师 / 教室 / 时间）</p>');
    var curWeek = weekIndexOf(startOfDay(new Date()), parseYmd(state.termStart));
    body.push('<table class="detail"><thead><tr><th>周次</th><th>星期·节次</th><th>教师</th><th>教室</th><th>时间</th></tr></thead><tbody>');
    for (var t = 0; t < group.entries.length; t++) {
      var it2 = group.entries[t];
      var isCur = weekInRanges(curWeek, it2.weekRanges);
      body.push('<tr class="' + (isCur ? "is-current-week" : "") + '">');
      body.push('<td class="wk">' + esc(it2.weekText || "全学期") + "</td>");
      body.push("<td>" + DAYS[it2.day - 1] + " 第 " + (it2.periodStart === it2.periodEnd ? it2.periodStart : (it2.periodStart + "-" + it2.periodEnd)) + " 节</td>");
      body.push("<td>" + esc(it2.teacher || "—") + "</td>");
      body.push("<td>" + esc(it2.room || "—") + "<br><span style='font-size:11.5px;color:var(--text-3)'>" + esc(it2.campus || "") + "</span></td>");
      body.push('<td class="tm">' + esc(it2.time) + "</td>");
      body.push("</tr>");
    }
    body.push("</tbody></table>");

    body.push('<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">');
    body.push('<button class="wb-btn" id="mSearch">在周视图中筛选</button>');
    if (group.entries.length) body.push('<button class="wb-btn" id="mToday">看看今天有没有</button>');
    body.push("</div>");

    $("mBody").innerHTML = body.join("");
    $("mBody").scrollTop = 0;
    $("overlay").hidden = false;
    document.body.style.overflow = "hidden";

    var ms = $("mSearch");
    if (ms) ms.addEventListener("click", function () {
      closeDetail();
      setSearch(group.code || group.name);
    });
    var mt = $("mToday");
    if (mt) mt.addEventListener("click", function () {
      closeDetail();
      switchTab("today");
    });
  }
  function closeDetail() {
    $("overlay").hidden = true;
    document.body.style.overflow = "";
  }

  /* ------------------------------------------------------------------
     9. 搜索
     ------------------------------------------------------------------ */
  function searchCourses(q) {
    q = String(q || "").trim().toLowerCase();
    if (!q) return [];
    var hits = [];
    for (var i = 0; i < DATA.courseList.length; i++) {
      var g = DATA.courseList[i];
      var hay = (g.name + " " + g.code + " " + g.teachers.join(" ") + " " + g.rooms.join(" ")).toLowerCase();
      if (hay.indexOf(q) >= 0) {
        var score = 0;
        if (g.name.toLowerCase().indexOf(q) === 0) score += 100;
        else if (g.name.toLowerCase().indexOf(q) >= 0) score += 50;
        if (g.code.toLowerCase().indexOf(q) >= 0) score += 40;
        if (g.teachers.join(" ").toLowerCase().indexOf(q) >= 0) score += 20;
        if (g.rooms.join(" ").toLowerCase().indexOf(q) >= 0) score += 10;
        hits.push({ g: g, score: score });
      }
    }
    hits.sort(function (a, b) { return b.score - a.score || a.g.name.localeCompare(b.g.name, "zh"); });
    return hits.map(function (h) { return h.g; });
  }

  function renderSearchResults() {
    var box = $("searchResults");
    var q = state.q.trim();
    if (!q) { box.hidden = true; box.innerHTML = ""; return; }
    var hits = searchCourses(q).slice(0, 12);
    if (!hits.length) {
      box.hidden = false;
      box.innerHTML = '<div class="sr-empty">没找到匹配的课程</div>';
      return;
    }
    var h = [];
    for (var i = 0; i < hits.length; i++) {
      var g = hits[i];
      var slots = [];
      for (var e = 0; e < g.entries.length && slots.length < 3; e++) {
        var en = g.entries[e];
        var sl = DAYS[en.day - 1] + " " + en.time;
        if (slots.indexOf(sl) < 0) slots.push(sl);
      }
      h.push('<button class="sr-item" data-code="' + esc(g.code) + '" role="option">' +
        '<span class="sr-dot" style="background:' + g.color + '"></span>' +
        '<span class="sr-main"><span class="sr-name">' + esc(g.name) + "</span>" +
        '<span class="sr-meta">' + esc(slots.join(" · ")) + (g.teachers.length ? " · " + esc(g.teachers.slice(0, 2).join("/")) : "") + "</span></span>" +
        '<span class="sr-code">' + esc(g.code) + "</span></button>");
    }
    box.innerHTML = h.join("");
    box.hidden = false;
  }

  function setSearch(q) {
    state.q = q;
    $("q").value = q;
    $("searchbar").classList.toggle("has-value", !!q);
    $("q").setAttribute("aria-expanded", q ? "true" : "false");
    if (q) {
      // 自动切到整周视图，并跳到该课程有课的周次
      var hits = searchCourses(q);
      if (hits.length) {
        var g0 = hits[0];
        var target = null;
        var realWk = weekIndexOf(startOfDay(new Date()), parseYmd(state.termStart));
        // 优先当前周，其次该课最早出现的周
        for (var i = 0; i < g0.entries.length; i++) {
          if (weekInRanges(realWk, g0.entries[i].weekRanges)) { target = realWk; break; }
        }
        if (target === null) {
          for (var w = 1; w <= 18; w++) {
            for (var j = 0; j < g0.entries.length; j++) {
              if (weekInRanges(w, g0.entries[j].weekRanges)) { target = w; break; }
            }
            if (target !== null) break;
          }
        }
        if (target !== null) state.week = Math.max(1, Math.min(18, target));
      }
      if (state.tab !== "week") switchTab("week", true);
    }
    renderSearchResults();
    renderAll();
    syncURL();
  }

  /* ------------------------------------------------------------------
     10. 主题 / 设置
     ------------------------------------------------------------------ */
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme || "auto");
    var btn = $("btnTheme");
    if (btn) btn.textContent = state.theme === "dark" ? "☀️" : (state.theme === "light" ? "🌙" : "🌗");
  }
  function loadSettings() {
    try {
      var ts = localStorage.getItem(LS.termStart);
      if (parseYmd(ts)) state.termStart = ts;
      var th = localStorage.getItem(LS.theme);
      if (th === "auto" || th === "light" || th === "dark") state.theme = th;
      var so = localStorage.getItem(LS.showOff);
      if (so === "0") state.showOffWeek = false;
      if (so === "1") state.showOffWeek = true;
      var dov = parseInt(localStorage.getItem(LS.dayOverride) || "0", 10);
      if (dov >= 1 && dov <= 7) state.dayOverride = dov;
    } catch (err) { /* localStorage 不可用（file:// 隐私模式等）时静默降级 */ }
  }
  function saveSettings() {
    try {
      localStorage.setItem(LS.termStart, state.termStart);
      localStorage.setItem(LS.theme, state.theme);
      localStorage.setItem(LS.showOff, state.showOffWeek ? "1" : "0");
      localStorage.setItem(LS.dayOverride, String(state.dayOverride || 0));
    } catch (err) { /* ignore */ }
  }

  /* ------------------------------------------------------------------
     11. URL 深链：?week=5&view=week&q=xxx&day=3&start=2026-08-31
     ------------------------------------------------------------------ */
  function readURL() {
    var sp;
    try { sp = new URLSearchParams(location.search); } catch (err) { return; }
    var v = sp.get("view");
    if (v === "week" || v === "today") state.tab = v;
    var w = parseInt(sp.get("week") || "", 10);
    if (w >= 1 && w <= 18) state.week = w;
    var q = sp.get("q");
    if (q) { state.q = q; $("q").value = q; $("searchbar").classList.add("has-value"); }
    var d = parseInt(sp.get("day") || "", 10);
    if (d >= 1 && d <= 7) state.dayOverride = d;
    var st = sp.get("start");
    if (parseYmd(st)) state.termStart = st;
  }
  function syncURL() {
    try {
      var sp = new URLSearchParams();
      sp.set("view", state.tab);
      sp.set("week", String(state.week));
      if (state.q.trim()) sp.set("q", state.q.trim());
      if (state.dayOverride) sp.set("day", String(state.dayOverride));
      if (state.termStart !== DEFAULT_TERM_START) sp.set("start", state.termStart);
      var qs = sp.toString();
      // 用 location.pathname + search + hash 重建，保证 file:// 双击打开时也可用
      history.replaceState(null, "", location.pathname + "?" + qs + (location.hash || ""));
    } catch (err) { /* file:// 下 replaceState 可能被拒 → 静默降级 */ }
  }

  /* ------------------------------------------------------------------
     12. 周次 UI
     ------------------------------------------------------------------ */
  function currentRealWeek() { return weekIndexOf(startOfDay(new Date()), parseYmd(state.termStart)); }

  function clampWeek(w) { return Math.max(1, Math.min(18, w)); }

  function renderWeekBar() {
    var real = currentRealWeek();
    $("wkLabelNum").textContent = "第 " + state.week + " 周";
    var isNow = real === state.week;
    $("wkNow").classList.toggle("primary", !isNow);
    $("wkNow").classList.toggle("wb-btn", true);
    $("wkBadge").hidden = !isNow;
    if (isNow) $("wkBadgeN").textContent = String(state.week);
    $("wkPrev").disabled = state.week <= 1;
    $("wkNext").disabled = state.week >= 18;
    $("wkSelect").value = String(state.week);

    // 顶部时钟
    var now = new Date();
    $("clockBadge").textContent = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
  }
  function goWeek(w) {
    state.week = clampWeek(w);
    renderWeekBar();
    if (state.tab === "week") renderWeek(); else renderToday();
    syncURL();
  }

  /* ------------------------------------------------------------------
     13. Tab 切换 & 图例
     ------------------------------------------------------------------ */
  function switchTab(tab, silent) {
    state.tab = tab;
    $("tabToday").setAttribute("aria-selected", tab === "today" ? "true" : "false");
    $("tabWeek").setAttribute("aria-selected", tab === "week" ? "true" : "false");
    $("panelToday").hidden = tab !== "today";
    $("panelWeek").hidden = tab !== "week";
    if (tab === "week") renderWeek(); else renderToday();
    syncURL();
  }

  function renderLegend() {
    var box = $("legend");
    if (!box) return;
    var h = ["<h4>课程图例（点击查看详情）</h4>"];
    for (var i = 0; i < DATA.courseList.length; i++) {
      var g = DATA.courseList[i];
      h.push('<button class="legend-item" data-code="' + esc(g.code) + '">' +
        '<span class="legend-dot" style="background:' + g.color + '"></span>' +
        '<span class="lg-name">' + esc(g.name) + "</span>" +
        '<span class="lg-code">' + esc(g.code) + "</span></button>");
    }
    box.innerHTML = h.join("");
  }

  /* ------------------------------------------------------------------
     14. 一次性重建
     ------------------------------------------------------------------ */
  function renderAll() {
    renderToday();
    if (state.tab === "week") renderWeek();
    renderWeekBar();
  }

  /* ------------------------------------------------------------------
     15. 事件绑定
     ------------------------------------------------------------------ */
  function bind() {
    // 时钟：每分钟刷新
    function tick() {
      var n = new Date();
      state.nowMin = n.getHours() * 60 + n.getMinutes();
      state.todayDow = isoDow(n);
      var real = currentRealWeek();
      $("clockBadge").textContent = pad2(n.getHours()) + ":" + pad2(n.getMinutes());
      if (state.tab === "today") renderToday();
      else renderWeek();
      // 「本周」按钮状态
      $("wkNow").classList.toggle("primary", real !== state.week);
      $("wkBadge").hidden = real !== state.week;
      $("wkBadgeN").textContent = String(state.week);
    }
    tick();
    // 对齐到整分钟后再开始 60s 心跳
    var msToNextMin = 60000 - (Date.now() % 60000);
    setTimeout(function () { tick(); setInterval(tick, 60000); }, msToNextMin + 50);
    // 页面重新可见时立刻刷新（手机切回来）
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) tick();
    });

    // Tabs
    $("tabToday").addEventListener("click", function () { switchTab("today"); });
    $("tabWeek").addEventListener("click", function () { switchTab("week"); });

    // 周次
    $("wkPrev").addEventListener("click", function () { goWeek(state.week - 1); });
    $("wkNext").addEventListener("click", function () { goWeek(state.week + 1); });
    $("wkNow").addEventListener("click", function () {
      var real = currentRealWeek();
      if (real >= 1 && real <= 18) goWeek(real);
      else { goWeek(clampWeek(real) || 1); toast("当前日期不在 1-18 教学周内"); }
    });
    $("btnLocate").addEventListener("click", function () {
      var real = currentRealWeek();
      goWeek(clampWeek(real));
      switchTab("today");
      window.scrollTo({ top: 0, behavior: "smooth" });
      toast("已回到第 " + clampWeek(real) + " 周 · 今天");
    });
    var sel = $("wkSelect");
    for (var w = 1; w <= 18; w++) {
      var o = document.createElement("option");
      o.value = String(w);
      o.textContent = "第 " + w + " 周";
      sel.appendChild(o);
    }
    sel.addEventListener("change", function () { goWeek(parseInt(sel.value, 10)); });

    // 搜索
    var qEl = $("q"), timer = null;
    qEl.addEventListener("input", function () {
      var v = qEl.value;
      $("searchbar").classList.toggle("has-value", !!v);
      state.q = v;
      renderSearchResults();
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (state.tab === "week") renderWeek();
        syncURL();
      }, 180);
    });
    qEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var first = $("searchResults").querySelector(".sr-item");
        if (first) { doSearchPick(first.getAttribute("data-code")); }
        else if (state.q.trim()) { switchTab("week"); toast("在整周视图中高亮匹配课程"); }
      } else if (e.key === "Escape") { clearSearch(); }
    });
    $("qClear").addEventListener("click", clearSearch);
    $("searchResults").addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest(".sr-item") : null;
      if (btn) doSearchPick(btn.getAttribute("data-code"));
    });
    document.addEventListener("click", function (e) {
      if (!$("searchbar").contains(e.target)) $("searchResults").hidden = true;
    });

    // 网格 / 卡片点击
    document.addEventListener("click", function (e) {
      var blk = e.target.closest ? e.target.closest(".blk") : null;
      if (blk) { openDetail(blk.getAttribute("data-code"), blk.getAttribute("data-uid")); return; }
      var det = e.target.closest ? e.target.closest(".js-detail") : null;
      if (det) { openDetail(det.getAttribute("data-code"), det.getAttribute("data-uid")); return; }
      var lg = e.target.closest ? e.target.closest(".legend-item") : null;
      if (lg) { openDetail(lg.getAttribute("data-code")); return; }
    });

    // 详情开关
    $("mClose").addEventListener("click", closeDetail);
    $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeDetail(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (!$("overlay").hidden) closeDetail();
        else if (!$("sheet").hidden) toggleSheet(false);
        else if (state.q) clearSearch();
      }
      // 左右方向键翻周
      if (e.key === "ArrowLeft" && e.altKey) goWeek(state.week - 1);
      if (e.key === "ArrowRight" && e.altKey) goWeek(state.week + 1);
    });

    // 设置面板
    $("btnSettings").addEventListener("click", function (e) { e.stopPropagation(); toggleSheet($("sheet").hidden); });
    $("sheetBg").addEventListener("click", function () { toggleSheet(false); });
    $("sheet").addEventListener("click", function (e) { e.stopPropagation(); });

    var tsInput = $("termStart");
    tsInput.value = state.termStart;
    tsInput.addEventListener("change", function () {
      if (!parseYmd(tsInput.value)) { toast("日期格式不正确"); return; }
      state.termStart = tsInput.value;
      saveSettings();
      // 周次会变，重新定位
      var real = currentRealWeek();
      state.week = clampWeek(real >= 1 ? real : 1);
      renderAll();
      syncURL();
      toast("已设置第 1 教学周起始日：" + state.termStart);
    });

    var dov = $("dayOverride");
    (function () {
      var o0 = document.createElement("option");
      o0.value = "0"; o0.textContent = "自动（真实今天）";
      dov.appendChild(o0);
      for (var d = 1; d <= 7; d++) {
        var o = document.createElement("option");
        o.value = String(d); o.textContent = "周" + "一二三四五六日".charAt(d - 1);
        dov.appendChild(o);
      }
      dov.value = String(state.dayOverride || 0);
      dov.addEventListener("change", function () {
        state.dayOverride = parseInt(dov.value, 10) || 0;
        saveSettings(); renderAll(); syncURL();
      });
    })();

    var thSel = $("themeSel");
    thSel.value = state.theme;
    thSel.addEventListener("change", function () {
      state.theme = thSel.value; applyTheme(); saveSettings();
    });
    $("btnTheme").addEventListener("click", function () {
      var order = ["auto", "light", "dark"];
      var i = order.indexOf(state.theme);
      state.theme = order[(i + 1) % 3];
      thSel.value = state.theme;
      applyTheme(); saveSettings();
      toast(state.theme === "auto" ? "外观：跟随系统" : (state.theme === "dark" ? "外观：深色" : "外观：浅色"));
    });
    $("btnReset").addEventListener("click", function () {
      state.termStart = DATA.termStart || DEFAULT_TERM_START;
      state.theme = "auto";
      state.showOffWeek = true;
      state.dayOverride = 0;
      state.q = "";
      $("q").value = ""; $("searchbar").classList.remove("has-value");
      $("searchResults").hidden = true;
      tsInput.value = state.termStart; thSel.value = "auto"; dov.value = "0";
      $("showOff").checked = true;
      applyTheme(); saveSettings();
      state.week = clampWeek(currentRealWeek() || 1);
      renderAll(); syncURL();
      toast("已恢复默认设置");
    });

    // 非本周开关
    var so = $("showOff");
    so.checked = state.showOffWeek;
    so.addEventListener("change", function () {
      state.showOffWeek = so.checked; saveSettings(); renderWeek();
    });

    // 系统主题变化
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onSys = function () { if (state.theme === "auto") applyTheme(); };
      if (mq.addEventListener) mq.addEventListener("change", onSys);
      else if (mq.addListener) mq.addListener(onSys);
    }

    // 窗口尺寸变化后重绘（±键提示）——交给 CSS 即可，无需 JS
  }

  function clearSearch() {
    state.q = "";
    $("q").value = "";
    $("searchbar").classList.remove("has-value");
    $("q").setAttribute("aria-expanded", "false");
    $("searchResults").hidden = true;
    $("searchResults").innerHTML = "";
    renderAll();
    syncURL();
  }
  function doSearchPick(code) {
    $("searchResults").hidden = true;
    if (state.tab !== "week") switchTab("week", true);
    else renderWeek();
    // 滚动到第一个匹配块
    var blk = document.querySelector('.blk.is-match');
    if (blk) blk.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
    var g = null;
    for (var i = 0; i < DATA.courseList.length; i++) if (DATA.courseList[i].code === code) { g = DATA.courseList[i]; break; }
    if (g) toast("已定位到「" + g.name + "」");
  }
  function toggleSheet(show) {
    $("sheet").hidden = !show;
    $("sheetBg").hidden = !show;
    $("btnSettings").setAttribute("aria-expanded", show ? "true" : "false");
  }
  var toastTimer = null;
  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
  }

  /* ------------------------------------------------------------------
     16. 启动
     ------------------------------------------------------------------ */
  function boot() {
    // 放在这里初始化：此时上面所有常量（PERIOD_COUNT / *_SLOTS / CODE_COLORS）都已赋值。
    DATA = normalizeData(RAW_DATA);
    DBG = DATA.dbg || [];
    loadSettings();
    readURL();
    applyTheme();
    $("semSub").textContent = DATA.courses.length + " 条课程安排 · 9 门课";
    $("footCount").textContent = DATA.courses.length + " 条安排 · " + DATA.courseList.length + " 门课程" +
      (DBG.length ? " · " + DBG.length + " 条被跳过" : "");
    var n = new Date();
    state.nowMin = n.getHours() * 60 + n.getMinutes();
    state.todayDow = isoDow(n);
    var real = currentRealWeek();
    state.week = clampWeek(real >= 1 ? real : (state.week || 1));

    // 窄屏默认「今天」
    if (window.innerWidth <= 700 && !/[?&]view=week/.test(location.search)) state.tab = "today";

    renderLegend();
    bind();
    switchTab(state.tab, true);
    renderWeekBar();
    syncURL();

    // 暴露给自动化测试使用（不影响功能）
    window.__KB__ = {
      data: DATA,
      state: state,
      live: function () { return liveTick; },
      switchTab: switchTab,
      goWeek: goWeek,
      setSearch: setSearch,
      openDetail: openDetail,
      renderAll: renderAll,
      version: "1.0"
    };
    if (DBG.length && window.console) console.warn("[课表] 跳过的条目：", DBG);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
